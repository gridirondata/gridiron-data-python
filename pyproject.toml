[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gridirondata"
version = "0.1.0"
description = "Official Python client for the GridIron Data fantasy football API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "GridIron Data", email = "support@gridirondata.com" }]
keywords = ["fantasy football", "nfl", "api", "projections", "sports data"]
dependencies = ["requests>=2.25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.gridirondata.com"
Documentation = "https://www.gridirondata.com/pages/docs.html"
Source = "https://github.com/gridirondata/gridiron-data-python"

[tool.hatch.build.targets.wheel]
packages = ["src/gridirondata"]
